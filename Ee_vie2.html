<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 Vie quotidienne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --blue:   #3AABDC;
  --green:  #5DB88A;
  --orange: #EE5818;
  --amber:  #D4840A;
  --purple: #A18CD0;
  --dark:   #2A2D35;
  --grey:   #6E7E8A;
  --bg:     #DDE4EC;
  --white:  #FFFFFF;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:'Nunito','Century Gothic',sans-serif;
  background:var(--bg);
  color:var(--dark);
  min-height:100vh;
  display:flex; flex-direction:column; overflow-y:auto;
}

/* ─── HEADER ─── */
.app-header{
  background:var(--white);
  border-bottom:3px solid #3AABDC;
  padding:0 1.5rem;
  display:flex; align-items:center; justify-content:space-between;
  height:54px; flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}
.hdr-left{display:flex;align-items:center;gap:.9rem;}
.hdr-logo{height:32px;width:auto;}
.hdr-sep{width:1px;height:26px;background:#D0DDE8;}
.hdr-info{display:flex;flex-direction:column;gap:.05rem;}
.hdr-num{font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);}
.hdr-title{font-size:.83rem;font-weight:700;color:var(--dark);max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-badge{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .7rem;border-radius:20px;background:#3AABDC;color:white;white-space:nowrap;}

/* ─── STAGE ─── */
.stage{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  padding:1rem 1.5rem .6rem;
  min-height:0; overflow:visible;
}

/* ─── SLIDE WRAPPER ─── */
.slide-wrap{
  width:100%; max-width:900px;
  flex:1; min-height:0;
  display:flex; flex-direction:column;
  border-radius:16px; overflow:visible;
  box-shadow:0 8px 36px rgba(0,0,0,.15);
  background:var(--white);
  transition:opacity .15s ease;
}
.slide-wrap.fade{opacity:0;}

/* ══════════════════
   COVER SLIDE
══════════════════ */
.cover-slide{
  flex:1; position:relative;
  background:#FFFFFF;border-top:6px solid #3AABDC;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.cover-glow{
  position:absolute; top:-30%; left:50%; transform:translateX(-50%);
  width:700px; height:500px;
  background:radial-gradient(ellipse,#3AABDC28 0%,transparent 70%);
  pointer-events:none;
}
.cover-logo-wrap{
  padding:1.4rem 2rem .5rem;
  background:#F8FAFB;
  border-bottom:1px solid #E4EDF3;
  flex-shrink:0;
}
.cover-logo{height:36px;width:auto;filter:brightness(1.1);}
.cover-body{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center; padding:2rem 3rem;
}
.cover-badge{
  display:inline-block; padding:.28rem 1rem; border-radius:20px;
  font-size:.7rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  border:1px solid transparent; margin-bottom:1.3rem;
}
.cover-icon{font-size:3.8rem;line-height:1;margin-bottom:.9rem;}
.cover-title{
  font-size:clamp(1.4rem,3vw,2.2rem);
  font-weight:800; color:#2A2D35; line-height:1.25; margin-bottom:1rem;
}
.cover-subs{display:flex;flex-direction:column;gap:.4rem;}
.cover-sub-line{font-size:.9rem;color:#6E7E8A;font-weight:400;}
.cover-bar{
  height:4px; flex-shrink:0;
}

/* ══════════════════
   CONTENT SLIDE
══════════════════ */
.content-slide{
  flex:1; display:flex; flex-direction:column; min-height:0;
}

/* Slide header */
.slide-hdr{
  display:flex; align-items:center; justify-content:space-between;
  padding:.7rem 1.4rem; flex-shrink:0;
  border-bottom:1px solid #EDF2F7;
}
.slide-hdr-left{display:flex;align-items:center;gap:.8rem;}
.slide-dot{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:.72rem;font-weight:800;flex-shrink:0;
}
.slide-lnum{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-bottom:.05rem;}
.slide-title{font-size:.95rem;font-weight:800;color:var(--dark);line-height:1.2;}
.type-pill{
  font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.22rem .65rem;border-radius:20px;white-space:nowrap;flex-shrink:0;
}

/* Slide body */
.slide-body{
  flex:1; overflow-y:auto; padding:1.4rem 2rem;
  scroll-behavior:smooth;
  display:flex; flex-direction:column;
}

/* ── density modifiers ── */
.density-sparse .slide-body{ justify-content:center; gap:0; }
.density-sparse .body-p,
.density-sparse .em-item,
.density-sparse .big-q{ margin-bottom:1.2rem; font-size:1rem; line-height:2; }
.density-sparse li{ padding-top:.6rem; padding-bottom:.6rem; font-size:.95rem; }
.density-sparse .num-item,
.density-sparse .num-head{ padding:.7rem 0; font-size:.95rem; }

.density-normal .slide-body{ justify-content:flex-start; }
.density-normal .body-p{ margin-bottom:.6rem; }

.density-dense .body-p{ margin-bottom:.35rem; font-size:.84rem; line-height:1.65; }
.density-dense li{ font-size:.83rem; padding:.25rem 0 .25rem 1.3rem; }

/* ── CONTENT ELEMENTS ── */
.sec-h3{
  font-size:.9rem;font-weight:800;
  margin:1rem 0 .4rem; padding-bottom:.3rem;
  border-bottom:2px solid currentColor;
}
.sec-h3:first-child{margin-top:0;}

.body-p{font-size:.9rem;line-height:1.8;margin-bottom:.55rem;color:var(--dark);}
.body-p:last-child{margin-bottom:0;}
.body-p strong{font-weight:700;}

ul{list-style:none;padding:0;margin:.4rem 0;}
li{
  font-size:.88rem;line-height:1.7;
  padding:.32rem 0 .32rem 1.5rem;
  position:relative;border-bottom:1px solid #F0F4F8;
}
li:last-child{border-bottom:none;}
li::before{
  content:'›';position:absolute;left:.3rem;
  color:var(--acc,var(--blue));font-size:1.1rem;font-weight:700;line-height:1.5;
}
li.lvl1{padding-left:2.6rem;font-size:.83rem;color:#555;}
li.lvl1::before{left:1.4rem;content:'–';font-size:.85rem;}

.em-item{
  font-size:.95rem;line-height:1.75;
  padding:.5rem 0;border-bottom:1px solid #F0F4F8;
}
.em-item:last-child{border-bottom:none;}

.big-q{
  font-size:clamp(.95rem,2vw,1.2rem);
  font-weight:600;line-height:1.65;
  padding:.7rem 1rem;margin:.35rem 0;
  background:var(--tint,#F0F7FB);
  border-left:5px solid var(--acc,var(--blue));
  border-radius:0 10px 10px 0;
}

.num-head{
  display:flex;align-items:flex-start;gap:.7rem;
  padding:.55rem 0;border-bottom:2px solid var(--tint,#EEF4F8);
  margin-bottom:.3rem;
}
.num-item{
  display:flex;align-items:flex-start;gap:.65rem;
  padding:.45rem 0;border-bottom:1px solid #F0F4F8;
}
.num-item:last-child,.num-head:last-child{border-bottom:none;}
.num-dot{
  min-width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:.68rem;font-weight:800;flex-shrink:0;margin-top:.15rem;
}
.num-head .num-dot{width:28px;height:28px;font-size:.75rem;}
.num-item span:last-child,.num-head span:last-child{font-size:.88rem;line-height:1.7;}
.num-head span:last-child{font-size:.93rem;font-weight:700;}

/* ── SUJET BOX ── */
.sujet-box{
  background:linear-gradient(135deg,#FEF0E8,#FDE4D2);
  border:2px solid #EE5818;
  border-radius:12px;
  padding:1.4rem 1.6rem;
  font-size:.97rem;font-weight:600;line-height:1.85;
  color:var(--dark);
  box-shadow:0 2px 14px rgba(238,88,24,.14);
  margin-bottom:1rem;
}

/* ── LETTER BOX ── */
.letter-box{
  background:#FFFEF8;border:1.5px solid #E8E0C8;
  border-radius:12px;padding:1.5rem 2rem;
  font-size:.92rem;line-height:1.9;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.letter-line{padding:.05rem 0;}
.letter-bold{font-weight:700;}

/* ── FILL-IN BLANKS ── */
.blank-line{
  font-size:.9rem;line-height:1.9;
  padding:.4rem 0;border-bottom:1px solid #F0F4F8;
}
.blank-line:last-child{border-bottom:none;}
.fill-blank{
  display:inline-block;
  border:none;border-bottom:2.5px solid var(--acc,var(--blue));
  background:var(--tint,#E8F4FB);
  border-radius:4px 4px 0 0;
  padding:.1rem .4rem;
  font-family:'Nunito',sans-serif;font-size:.88rem;
  color:var(--dark);outline:none;
  transition:background .18s;
  vertical-align:middle;
}
.fill-blank:focus{background:#fff;box-shadow:0 2px 0 var(--acc,var(--blue));}
.fill-blank::placeholder{color:#AAB8C4;font-style:italic;}

/* ── WRITE AREAS ── */
.write-area{
  flex:1; margin-top:.8rem;
  min-height:120px;
  background:#FAFCFF;
  border:2px dashed #C8D8E8;
  border-radius:10px;
  padding:1rem 1.2rem;
  font-family:'Nunito',sans-serif;font-size:.9rem;line-height:1.8;
  color:var(--dark);outline:none;cursor:text;
  position:relative;
}
.write-area-lg{
  flex:1; margin:.5rem 0;
  min-height:200px;
  background:#FAFCFF;
  border:2px dashed #C8D8E8;
  border-radius:10px;
  padding:1.2rem 1.5rem;
  font-family:'Nunito',sans-serif;font-size:.9rem;line-height:1.9;
  color:var(--dark);outline:none;cursor:text;
}
.write-area-sm{
  margin-top:.8rem;min-height:80px;
  background:#FAFCFF;border:2px dashed #C8D8E8;border-radius:10px;
  padding:.9rem 1.1rem;
  font-family:'Nunito',sans-serif;font-size:.88rem;line-height:1.8;
  color:var(--dark);outline:none;cursor:text;
}
.write-placeholder{color:#B0C0CC;font-style:italic;pointer-events:none;}
[contenteditable]:focus .write-placeholder{display:none;}
[contenteditable]:not(:empty) .write-placeholder{display:none;}

/* ─── NAV BAR ─── */
.nav-bar{width:100%;max-width:900px;display:flex;align-items:center;gap:1rem;padding:.6rem 0;flex-shrink:0;background:var(--bg);border-bottom:1px solid #C8D8E4;}
.nav-btn{
  display:flex;align-items:center;justify-content:center;
  background:var(--white);border:1.5px solid #C0D0DC;
  color:var(--grey);font-family:'Nunito',sans-serif;
  font-size:1rem;font-weight:700;
  width:42px;height:42px;border-radius:50%;cursor:pointer;
  transition:all .18s;box-shadow:0 1px 5px rgba(0,0,0,.06);
  flex-shrink:0;
}
.nav-btn:hover:not(:disabled){border-color:#3AABDC;color:#3AABDC;background:#3AABDC0d;}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nav-btn.next{background:var(--white);color:var(--grey);border-color:#C0D0DC;}
.nav-btn.next:hover:not(:disabled){border-color:#3AABDC;color:#3AABDC;background:#3AABDC0d;}
.nav-btn.done{background:#5DB88A;color:white;border-color:#5DB88A;cursor:default;}

.prog-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:.25rem;}
.prog-track{width:100%;height:5px;background:#C8D8E4;border-radius:3px;overflow:hidden;}
.prog-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#3AABDC,#5DB88A);
  transition:width .35s cubic-bezier(.4,0,.2,1);
}
.prog-label{font-size:.68rem;font-weight:700;color:var(--grey);}
.kbd-hint{font-size:.6rem;color:#A0B4C0;text-align:center;padding-bottom:.05rem;}

@media(max-width:600px){
  .stage{padding:.7rem .8rem .4rem;}
  .slide-body{padding:1.1rem 1.1rem;}
  .hdr-title{max-width:140px;}
  .nav-btn{min-width:68px;padding:.42rem .7rem;font-size:.72rem;}
  .cover-icon{font-size:2.6rem;}
  .cover-title{font-size:1.3rem;}
}

/* ─── HEADER NAV ─── */
.hdr-nav{display:flex;align-items:center;gap:.5rem;}
.hdr-btn{
  width:32px;height:32px;border-radius:50%;
  border:1.5px solid #C0D0DC;background:var(--white);
  color:var(--grey);font-size:1rem;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;line-height:1;
}
.hdr-btn:hover:not(:disabled){border-color:#3AABDC;color:#3AABDC;background:#3AABDC0d;}
.hdr-btn:disabled{opacity:.3;cursor:not-allowed;}
.hdr-btn.next{background:#3AABDC;color:white;border-color:#3AABDC;}
.hdr-btn.next:hover:not(:disabled){filter:brightness(1.1);}
.hdr-btn.done{background:#5DB88A;color:white;border-color:#5DB88A;cursor:default;}
.hdr-prog-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:80px;}
.hdr-prog-track{width:80px;height:4px;background:#D0DDE8;border-radius:2px;overflow:hidden;}
.hdr-prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#3AABDC,#5DB88A);transition:width .3s;}
.hdr-prog-label{font-size:.6rem;font-weight:700;color:var(--grey);}

/* ─── ZOOM ─── */
.hdr-zoom{display:flex;align-items:center;gap:.4rem;}
.zoom-label{font-size:.65rem;font-weight:700;color:var(--grey);min-width:30px;text-align:right;}
.zoom-slider{
  -webkit-appearance:none;appearance:none;
  width:72px;height:4px;border-radius:2px;
  background:#D0DDE8;outline:none;cursor:pointer;
}
.zoom-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;
  background:#3AABDC;cursor:pointer;
}
.zoom-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:#3AABDC;cursor:pointer;border:none;
}
.slide-scale-wrap{
  width:100%;max-width:900px;
  flex:1;min-height:0;
  display:flex;align-items:flex-start;justify-content:center;
  overflow:auto;
}

/* ─── ZOOM MID ─── */
.zoom-mid{display:flex;align-items:center;gap:.5rem;}
.zoom-label{font-size:.68rem;font-weight:700;color:var(--grey);min-width:32px;text-align:right;}
.zoom-slider{
  -webkit-appearance:none;appearance:none;
  width:90px;height:4px;border-radius:2px;
  background:#C8D8E4;outline:none;cursor:pointer;
}
.zoom-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;
  background:#3AABDC;cursor:pointer;
}
.zoom-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:#3AABDC;cursor:pointer;border:none;
}
.slide-scale-wrap{
  width:100%;max-width:900px;
  flex:1;min-height:0;
  overflow:auto;
  display:flex;flex-direction:column;
}

.hdr-zoom-wrap{display:flex;align-items:center;gap:.45rem;}

/* ── PLEIN ÉCRAN / MODE PRÉSENTATION ── */
.hdr-right{display:flex;align-items:center;gap:.7rem;}
.fs-btn{display:flex;align-items:center;gap:.35rem;background:#FFF;border:1.5px solid #C0D0DC;color:#6E7E8A;font-family:'Nunito','Century Gothic',sans-serif;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.34rem .75rem;border-radius:20px;cursor:pointer;transition:all .18s;white-space:nowrap;}
.fs-btn:hover{border-color:#3AABDC;color:#3AABDC;background:#F4FAFE;}
body.present .app-header{display:none;}
body.present .kbd-hint{display:none;}
body.present .slide-wrap{max-width:none;border-radius:0;box-shadow:none;}
body.present .slide-scale-wrap{max-width:none;width:100%;}
body.present .nav-bar{position:fixed;left:50%;bottom:0;top:auto;transform:translateX(-50%);width:auto;max-width:none;margin:0;background:rgba(10,18,27,.78);backdrop-filter:blur(6px);border:none;border-radius:26px 26px 0 0;padding:.45rem 1.3rem;gap:1rem;z-index:120;opacity:.18;transition:opacity .25s;}
body.present .nav-bar:hover{opacity:1;}
body.present .prog-wrap{min-width:170px;}
body.present .prog-label{color:#FFF;}
body.present .prog-track{background:rgba(255,255,255,.25);}
body.present .nav-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#FFF;}
.size-ctrl{display:none;}
body.present .size-ctrl{display:flex;align-items:center;gap:.3rem;flex-shrink:0;}
.size-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);color:#FFF;font-family:'Nunito','Century Gothic',sans-serif;font-weight:800;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.size-btn:hover{background:rgba(255,255,255,.28);}
.size-val{font-size:.64rem;font-weight:800;color:#FFF;min-width:38px;text-align:center;}
.fs-exit{display:none;}
body.present .fs-exit{display:block;position:fixed;top:12px;right:16px;z-index:120;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:.24rem .7rem;cursor:pointer;}
/* ── DÉBORDEMENT DE TEXTE ── */
.slide-body>*{flex-shrink:0;}
body.present .slide-body{justify-content:safe center;}
[contenteditable]{overflow-wrap:break-word;}
.slide-body::-webkit-scrollbar{width:9px;}
.slide-body::-webkit-scrollbar-thumb{background:#C8D8E4;border-radius:5px;}
.slide-body::-webkit-scrollbar-track{background:transparent;}
/* ── CLAVIER D'ACCENTS FLOTTANT + COMPTEUR ── */
.acc-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:200;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:.26rem;max-width:min(94vw,880px);background:rgba(255,255,255,.97);border:1.5px solid #C8D8E4;box-shadow:0 8px 30px rgba(0,0,0,.2);border-radius:26px;padding:.45rem .8rem;}
.acc-bar.on{display:flex;}
body.present .acc-bar{bottom:78px;}
.acc-key{font-family:'Nunito','Century Gothic',sans-serif;font-size:.9rem;font-weight:700;color:#2A2D35;background:#FFF;border:1.5px solid #C8D8E4;border-radius:7px;min-width:31px;height:31px;padding:0 .35rem;cursor:pointer;line-height:1;transition:all .12s;}
.acc-key:hover{border-color:#3AABDC;color:#3AABDC;background:#F6FBFE;}
.acc-key:active{transform:translateY(1px);}
.acc-sep{width:1px;height:19px;background:#D8E4EC;margin:0 .18rem;}
.acc-count{font-size:.7rem;font-weight:800;color:#6E7E8A;background:#EEF4F9;border-radius:20px;padding:.26rem .7rem;white-space:nowrap;margin-left:.35rem;}
.acc-count.ok{background:#E6F6EC;color:#33805A;}
.acc-count.under{background:#FEF6E6;color:#A9781A;}
.acc-count.over{background:#FDECEC;color:#C0392B;}

body.present{background:#0A121B;overflow:hidden;height:100vh;}
body.present .stage{padding:0;height:100vh;overflow:hidden;justify-content:flex-start;}
body.present .slide-scale-wrap{height:100vh;overflow:hidden;justify-content:flex-start;align-items:stretch;}
</style>
</head>
<body>

const N=S.length,sw=document.getElementById('sw'),
      pf=document.getElementById('pf'),pl=document.getElementById('pl'),
      bp=document.getElementById('bp'),bn=document.getElementById('bn');
let cur=0;

function clearPlaceholder(el){
  el.addEventListener('focus',()=>{
    const ph=el.querySelector('.write-placeholder');
    if(ph)ph.style.display='none';
  });
  el.addEventListener('blur',()=>{
    const ph=el.querySelector('.write-placeholder');
    if(ph && el.innerText.trim()==='')ph.style.display='';
  });
}

// Zoom
const zr=document.getElementById('zr');
const zl=document.getElementById('zl');
function applyZoom(v){
  const scale=v/100;
  sw.style.transform='scale('+scale+')';
  sw.style.transformOrigin='top center';
  sw.style.width=(900*(1/scale))+'px';
  const ssw=document.getElementById('ssw');
  ssw.style.height=(sw.getBoundingClientRect().height+20)+'px';
  zl.textContent=v+'%';
}
zr.addEventListener('input',()=>applyZoom(parseInt(zr.value)));

function render(idx){
  sw.classList.add('fade');
  setTimeout(()=>{
    cur=idx;
    sw.innerHTML=S[cur];
    sw.querySelectorAll('[contenteditable]').forEach(clearPlaceholder);
    layout();sw.classList.remove('fade');
    pf.style.width=((cur+1)/N*100)+'%';
    pl.textContent=(cur+1)+' / '+N;
    bp.disabled=cur===0;
    if(cur===N-1){bn.className='hdr-btn done';bn.disabled=true;}
    else{bn.className='hdr-btn next';bn.disabled=false;}
    setTimeout(layout,150);
  },130);
}
function go(d){const n=cur+d;if(n>=0&&n<N)render(n);}
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)&&e.target.tagName!=='INPUT'&&!e.target.isContentEditable){e.preventDefault();go(1);}
  if(['ArrowLeft','ArrowUp'].includes(e.key)&&e.target.tagName!=='INPUT'&&!e.target.isContentEditable){e.preventDefault();go(-1);}
});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50&&!document.activeElement.isContentEditable)go(dx<0?1:-1);
},{passive:true});

/* ══ MODE PRÉSENTATION + CLAVIER FRANÇAIS + COMPTEUR DE MOTS ══ */
const SW=document.getElementById('sw'),SSW=document.getElementById('ssw'),DESIGN_W=1120;
const CARD=true;
let pz=1;
function inPresent(){return document.body.classList.contains('present');}
function fitBody(){}
function restoreNormal(){
  SW.style.width='';SW.style.height='';SW.style.minHeight='';SW.style.maxWidth='';SW.style.flex='';
  SW.style.transform='';SW.style.transformOrigin='top center';SW.style.margin='';
  if(SSW){SSW.style.height='';SSW.style.width='';SSW.style.maxWidth='';SSW.style.overflow='';}
  if(typeof zr!=='undefined'&&zr)zr.dispatchEvent(new Event('input'));
}
function layout(){
  if(inPresent()){
    const s=Math.min(window.innerWidth/DESIGN_W,2.4)*pz;
    const w=window.innerWidth/s;
    SW.style.maxWidth='none';SW.style.transformOrigin='top center';SW.style.margin='0 auto';
    SW.style.width=w+'px';SW.style.transform='scale('+s+')';
    if(CARD){
      SW.style.flex='none';SW.style.height=((window.innerHeight/s)-4)+'px';
      if(SSW){SSW.style.maxWidth='none';SSW.style.width='100%';SSW.style.height='100vh';SSW.style.overflow='hidden';}
    }else{
      SW.style.minHeight=((window.innerHeight/s)-4)+'px';
      if(SSW){SSW.style.maxWidth='none';SSW.style.width='100%';SSW.style.height=SW.getBoundingClientRect().height+'px';}
    }
  }else{restoreNormal();}
  fitBody();
}
function setSize(d){
  pz=Math.min(2.2,Math.max(.8,Math.round((pz+d*.1)*10)/10));
  const v=document.getElementById('szv');if(v)v.textContent=Math.round(pz*100)+'%';
  layout();
}
function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
function toggleFS(){
  const d=document.documentElement;
  if(!document.body.classList.contains('present')){
    const r=d.requestFullscreen||d.webkitRequestFullscreen;
    if(r){try{const p=r.call(d);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    document.body.classList.add('present');
  }else{
    const x=document.exitFullscreen||document.webkitExitFullscreen;
    if(x){try{x.call(document);}catch(e){}}
    document.body.classList.remove('present');
  }
  setTimeout(layout,120);setTimeout(layout,450);
}
function onFsChange(){
  document.body.classList.toggle('present',!!fsElement());
  const b=document.getElementById('fsb');
  if(b)b.querySelector('.fs-txt').textContent=fsElement()?'Quitter':'Plein écran';
  setTimeout(layout,120);setTimeout(layout,450);
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
window.addEventListener('resize',()=>layout());
document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable||e.target.tagName==='INPUT')return;
  if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFS();}
  if(e.key==='Escape'&&document.body.classList.contains('present')&&!fsElement()){document.body.classList.remove('present');layout();}
  if(inPresent()){
    if(e.key==='+'||e.key==='='){e.preventDefault();setSize(1);}
    if(e.key==='-'||e.key==='_'){e.preventDefault();setSize(-1);}
    if(e.key==='0'){e.preventDefault();pz=1;const v=document.getElementById('szv');if(v)v.textContent='100%';layout();}
  }else if(typeof zr!=='undefined'&&zr){
    if(e.key==='+'||e.key==='='){e.preventDefault();zr.value=Math.min(+zr.max,+zr.value+10);zr.dispatchEvent(new Event('input'));}
    if(e.key==='-'||e.key==='_'){e.preventDefault();zr.value=Math.max(+zr.min,+zr.value-10);zr.dispatchEvent(new Event('input'));}
    if(e.key==='0'){e.preventDefault();zr.value=100;zr.dispatchEvent(new Event('input'));}
  }
});
/* ── clavier d'accents flottant ── */
const ACC=['é','è','ê','ë','à','â','î','ï','ô','û','ù','ç','œ','æ','|','É','È','À','Ç','|','« ',' »','’'];
const accBar=document.createElement('div');accBar.className='acc-bar';
let curEd=null;
const accCount=document.createElement('span');accCount.className='acc-count';
ACC.forEach(ch=>{
  if(ch==='|'){const s=document.createElement('span');s.className='acc-sep';accBar.appendChild(s);return;}
  const b=document.createElement('button');b.type='button';b.className='acc-key';b.textContent=ch.trim()||ch;
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    if(!curEd)return;
    const p=curEd.querySelector?curEd.querySelector('.write-placeholder'):null;if(p)p.style.display='none';
    curEd.focus();
    if(curEd.tagName==='INPUT'||curEd.tagName==='TEXTAREA'){
      const s=curEd.selectionStart||0,e2=curEd.selectionEnd||0;
      curEd.value=curEd.value.slice(0,s)+ch+curEd.value.slice(e2);
      curEd.selectionStart=curEd.selectionEnd=s+ch.length;
    }else{document.execCommand('insertText',false,ch);}
    updCount();
  });
  accBar.appendChild(b);
});
accBar.appendChild(accCount);
document.body.appendChild(accBar);
function edText(el){
  if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')return el.value||'';
  const p=el.querySelector('.write-placeholder');
  let t=el.innerText||'';
  if(p&&p.offsetParent!==null&&p.innerText)t=t.split(p.innerText).join('');
  return t;
}
function updCount(){
  if(!curEd)return;
  const m=edText(curEd).match(/[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*/g);
  const n=m?m.length:0;
  const mn=parseInt(curEd.dataset.min||0),mx=parseInt(curEd.dataset.max||0);
  accCount.className='acc-count';
  if(mn&&mx){
    accCount.textContent=n+' / '+mn+'–'+mx+' mots';
    const st=(n===0?'':(n<mn?'under':(n>mx?'over':'ok')));
    if(st)accCount.classList.add(st);
  }else{accCount.textContent=n+(n>1?' mots':' mot');}
}
function edOf(t){return t&&t.closest?t.closest('[contenteditable],input[type=text],textarea'):null;}
document.addEventListener('focusin',e=>{const ed=edOf(e.target);if(ed){curEd=ed;accBar.classList.add('on');updCount();}});
/* en plein écran : empêche le focus d'une zone de saisie de faire remonter la diapo */
document.addEventListener('focusin',()=>{
  if(!inPresent())return;
  setTimeout(()=>{document.querySelectorAll('.stage,.slide-scale-wrap').forEach(el=>{el.scrollTop=0;el.scrollLeft=0;});},0);
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(!edOf(document.activeElement))accBar.classList.remove('on');},160);});
document.addEventListener('input',e=>{const ed=edOf(e.target);if(ed){curEd=ed;updCount();}});

render(0);layout();
</script>
